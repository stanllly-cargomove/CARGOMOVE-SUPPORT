name: Capture system version

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: system-version-main
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record and commit changed versions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node --experimental-strip-types scripts/capture-push-version.ts
            if git diff --quiet -- src/generated/system-versions.json; then
              exit 0
            fi
            git add src/generated/system-versions.json
            git commit -m 'chore: capture system version'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Version capture could not be pushed after three attempts.' >&2
          exit 1
