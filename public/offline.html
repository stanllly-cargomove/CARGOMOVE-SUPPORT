<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>You're offline | CargoMove</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0f172a; color: #f8fafc; font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 420px; }
      h1 { line-height: 1.2; }
      p { color: #cbd5e1; }
      button { border: 0; border-radius: 10px; padding: 12px 20px; background: #38bdf8; color: #0f172a; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <p>CargoMove Support</p>
      <h1>You're offline</h1>
      <p>Connect to the internet to use registration, tracking and admin tools. Then try again to return to this page.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
